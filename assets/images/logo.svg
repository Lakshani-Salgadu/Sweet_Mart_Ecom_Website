<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="frostingGrad" x1="12" y1="12" x2="36" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE8E8" />
      <stop offset="50%" stop-color="#E8A0A0" />
      <stop offset="100%" stop-color="#D67B7B" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="14" y1="28" x2="34" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8C5339" />
      <stop offset="100%" stop-color="#542E1B" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#3B2212" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cup / Base -->
  <path d="M14 28 L17.5 43 C17.8 44.2 18.8 45 20 45 L28 45 C29.2 45 30.2 44.2 30.5 43 L34 28 Z" fill="url(#cupGrad)" filter="url(#softGlow)"/>
  
  <!-- Cupcake liner folds -->
  <path d="M18.5 29 L20.5 44" stroke="#422414" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M24 29 L24 44.5" stroke="#422414" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M29.5 29 L27.5 44" stroke="#422414" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Frosting Bottom Layer -->
  <path d="M11 28.5 C11 26 13 24 16 24 C17.5 24 19 25 20.5 24 C22 23 23 21 24 21 C25 21 26 23 27.5 24 C29 25 30.5 24 32 24 C35 24 37 26 37 28.5 C37 31 34 32 31 31 C28 30 26 31 24 31 C22 31 20 30 17 31 C14 32 11 31 11 28.5 Z" fill="url(#frostingGrad)" filter="url(#softGlow)"/>

  <!-- Frosting Middle Swirl -->
  <path d="M14.5 22 C14.5 18.5 17.5 16.5 20.5 16.5 C22 16.5 23 17.5 24 17.5 C25 17.5 26 16.5 27.5 16.5 C30.5 16.5 33.5 18.5 33.5 22 C33.5 24 31.5 25.5 28.5 25 C26 24.5 24.5 24 24 24 C23.5 24 22 24.5 19.5 25 C16.5 25.5 14.5 24 14.5 22 Z" fill="#FCE8E8"/>

  <!-- Frosting Top Peak -->
  <path d="M18.5 16.5 C18.5 12.5 21.5 10.5 24 8.5 C26.5 10.5 29.5 12.5 29.5 16.5 C29.5 18.5 27.5 19.5 24 19.5 C20.5 19.5 18.5 18.5 18.5 16.5 Z" fill="url(#frostingGrad)"/>

  <!-- Cherry on Top -->
  <circle cx="24" cy="7.5" r="3.5" fill="#D9384E" filter="url(#softGlow)"/>
  <circle cx="23" cy="6.5" r="1" fill="#FFFFFF" opacity="0.8"/>
  <path d="M25 5 C26 3 28 2 30 2.5" stroke="#4A7C59" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Decorative Sprinkles -->
  <circle cx="18" cy="21" r="1" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="29" cy="20" r="0.9" fill="#FFD166" />
  <circle cx="22" cy="14" r="0.8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="26" cy="15" r="0.9" fill="#FFD166" />
</svg>
